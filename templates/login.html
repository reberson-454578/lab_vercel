{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Entrar</h1>
    <p class="subtitle">Laboratório de Informática</p>
    <form method="POST" action="{{ url_for('login') }}">
        <label>Usuário
            <input type="text" name="username" required autofocus autocomplete="username">
        </label>
        <label>Senha
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-link">Aluno novo? <a href="{{ url_for('register') }}">Cadastre-se aqui</a></p>
</div>
{% endblock %}
